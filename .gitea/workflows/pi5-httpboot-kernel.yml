name: pi5-httpboot-kernel

on:
  schedule:
    - cron: "0 8 * * 0"   # Sundays 08:00 UTC (03:00 EST)
  workflow_dispatch:

jobs:
  build:
    runs-on: [linux, host, docker]
    env:
      IRONHIDE_SSH_HOST: "ironhide.home.arpa"
      IRONHIDE_SSH_USER: "deployer"
      IRONHIDE_HTTPBOOT_DIR: "/srv/http/rpi/httpboot"
    steps:
      - name: Checkout
        env:
          GITEA_REPO_TOKEN: ${{ secrets.GITEA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf ./* ./.git || true
          git clone "http://gitgard.home.arpa:3000/smittyman/rpi5-debian.git" .
          git fetch --all --tags --prune
          SHA="${GITHUB_SHA:-${GITEA_SHA:-}}"
          if [ -n "${SHA:-}" ]; then git checkout -f "${SHA}"; fi
          git rev-parse --short HEAD

      - name: Install deps
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y git python3 python3-pip rsync zstd cpio dosfstools mtools parted wget curl
          apt-get install -y rpi-eeprom
          command -v rpi-eeprom-digest >/dev/null 2>&1 || {
            echo "ERROR: rpi-eeprom-digest not found (rpi-eeprom install failed?)"
            exit 1
          }
          pip3 install --break-system-packages pyyaml jinja2

      - name: Fetch Raspberry Pi firmware/kernel
        run: |
          set -euo pipefail
          chmod +x scripts/fetch_rpi_firmware.sh
          scripts/fetch_rpi_firmware.sh

      - name: Build Debian rootfs (arm64)
        run: |
          set -euo pipefail
          chmod +x scripts/build_rootfs.sh
          scripts/build_rootfs.sh

      - name: Build installer initramfs.gz
        env:
          HTTP_BASE: "http://192.168.3.26/rpi/httpboot"
        run: |
          set -euo pipefail
          chmod +x scripts/build_installer_initramfs.sh
          scripts/build_installer_initramfs.sh

      - name: Build boot.img for EEPROM HTTP boot
        run: |
          set -euo pipefail
          chmod +x scripts/build_boot_img.sh
          scripts/build_boot_img.sh

      - name: Stage publish payload (boot only)
        run: |
          set -euo pipefail
          chmod +x scripts/publish.sh
          PUBLISH_MODE=boot scripts/publish.sh

      - name: Materialize signing key
        env:
          RPI_HTTPBOOT_PRIVATE_PEM: ${{ secrets.RPI_HTTPBOOT_PRIVATE_PEM }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${RPI_HTTPBOOT_PRIVATE_PEM}"
          printf "%s" "$RPI_HTTPBOOT_PRIVATE_PEM" > rpi_httpboot_private.pem

      - name: Sign boot.img -> boot.sig
        run: |
          set -euo pipefail
          test -f dist/boot.img || { echo "Missing dist/boot.img"; exit 1; }
          rpi-eeprom-digest -i dist/boot.img -o dist/boot.sig -k rpi_httpboot_private.pem

      - name: Install MinIO client (mc)
        run: |
          set -euo pipefail
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          install -m 0755 /tmp/mc /usr/local/bin/mc
          mc --version

      - name: Publish dist/ to MinIO (latest + build-id folder)
        env:
          MINIO_ENDPOINT: "http://reboot.home.arpa:9000"
          MINIO_BUCKET: "rpi-artifacts"
          MINIO_PREFIX: "httpboot-kernel"
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_RPI_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_RPI_SECRET_KEY }}
        run: |
          set -euo pipefail

          export MC_CONFIG_DIR="$PWD/.mc"
          rm -rf "$MC_CONFIG_DIR"

          mc alias set reboot "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
          mc ls "reboot/$MINIO_BUCKET" >/dev/null

          SHORT_SHA="$(git rev-parse --short HEAD)"
          BUILD_TS="$(date -u +%Y%m%d-%H%M%S)"
          BUILD_ID="${BUILD_TS}-${SHORT_SHA}"

          # latest/ (stable URLs)
          mc mirror --overwrite --remove \
            dist/ \
            "reboot/$MINIO_BUCKET/$MINIO_PREFIX/latest/"

          # immutable build folder
          mc mirror --overwrite \
            dist/ \
            "reboot/$MINIO_BUCKET/$MINIO_PREFIX/$BUILD_ID/"

          cat > out/latest.json <<EOF
          {
            "build_id": "$BUILD_ID",
            "bucket": "$MINIO_BUCKET",
            "prefix": "$MINIO_PREFIX",
            "latest_root": "$MINIO_PREFIX/latest/",
            "build_root": "$MINIO_PREFIX/$BUILD_ID/"
          }
          EOF
          mc cp out/latest.json "reboot/$MINIO_BUCKET/$MINIO_PREFIX/latest.json"

      - name: Prune MinIO builds (keep last 6)
        env:
          MINIO_ENDPOINT: "http://reboot.home.arpa:9000"
          MINIO_BUCKET: "rpi-artifacts"
          MINIO_PREFIX: "httpboot-kernel"
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_RPI_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_RPI_SECRET_KEY }}
          RETAIN_BUILDS: "6"
        run: |
          set -euo pipefail

          export MC_CONFIG_DIR="$PWD/.mc-prune"
          rm -rf "$MC_CONFIG_DIR"

          mc alias set reboot "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"

          # List "folders" under the prefix and keep only build-id folders.
          # Excludes: latest/, latest.json, and any non-build entries.
          mc ls --json "reboot/$MINIO_BUCKET/$MINIO_PREFIX/" \
            | jq -r '
                select(.type=="folder")
                | .key
                | sub("/$";"")
                | select(. != "latest")
                | select(test("^[0-9]{8}-[0-9]{6}-[0-9a-f]{4,}$"))
              ' \
            | sort \
            > /tmp/build_ids.txt

          echo "Build folders found:"
          cat /tmp/build_ids.txt || true

          # If there are <= RETAIN_BUILDS, nothing to do
          COUNT="$(wc -l < /tmp/build_ids.txt || echo 0)"
          if [ "${COUNT}" -le "${RETAIN_BUILDS}" ]; then
            echo "Nothing to prune (count=${COUNT}, retain=${RETAIN_BUILDS})"
            exit 0
          fi

          KEEP_FILE=/tmp/keep_ids.txt
          tail -n "${RETAIN_BUILDS}" /tmp/build_ids.txt > "$KEEP_FILE"

          echo "Keeping:"
          cat "$KEEP_FILE"

          echo "Pruning:"
          while read -r BID; do
            [ -z "${BID}" ] && continue
            if ! grep -qx "${BID}" "$KEEP_FILE"; then
              echo "  deleting ${BID}/"
              mc rm --recursive --force "reboot/$MINIO_BUCKET/$MINIO_PREFIX/$BID/"
            fi
          done < /tmp/build_ids.txt
