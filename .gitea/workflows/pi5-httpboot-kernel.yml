name: pi5-httpboot-kernel

on:
  schedule:
    - cron: "0 8 * * 0"   # Sundays 08:00 UTC (03:00 EST)
  workflow_dispatch:

jobs:
  build:
    runs-on: [linux, host, docker]
    env:
      IRONHIDE_SSH_HOST: "ironhide.home.arpa"
      IRONHIDE_SSH_USER: "deployer"
      IRONHIDE_HTTPBOOT_DIR: "/srv/http/rpi/httpboot"
    steps:
      - name: Checkout
        env:
          GITEA_REPO_TOKEN: ${{ secrets.GITEA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf ./* ./.git || true
          git clone "http://gitgard.home.arpa:3000/smittyman/rpi5-debian.git" .
          git fetch --all --tags --prune
          SHA="${GITHUB_SHA:-${GITEA_SHA:-}}"
          if [ -n "${SHA:-}" ]; then git checkout -f "${SHA}"; fi
          git rev-parse --short HEAD

      - name: Install deps
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y git python3 python3-pip rsync zstd cpio dosfstools mtools parted wget curl
          apt-get install -y rpi-eeprom
          command -v rpi-eeprom-digest >/dev/null 2>&1 || {
            echo "ERROR: rpi-eeprom-digest not found (rpi-eeprom install failed?)"
            exit 1
          }
          pip3 install --break-system-packages pyyaml jinja2

      - name: Fetch Raspberry Pi firmware/kernel
        run: |
          set -euo pipefail
          chmod +x scripts/fetch_rpi_firmware.sh
          scripts/fetch_rpi_firmware.sh

      - name: Build Debian rootfs (arm64)
        run: |
          set -euo pipefail
          chmod +x scripts/build_rootfs.sh
          scripts/build_rootfs.sh

      - name: Build installer initramfs.gz
        env:
          HTTP_BASE: "http://192.168.3.26/rpi/httpboot"
        run: |
          set -euo pipefail
          chmod +x scripts/build_installer_initramfs.sh
          scripts/build_installer_initramfs.sh

      - name: Build boot.img for EEPROM HTTP boot
        run: |
          set -euo pipefail
          chmod +x scripts/build_boot_img.sh
          scripts/build_boot_img.sh

      - name: Stage publish payload (boot only)
        run: |
          set -euo pipefail
          chmod +x scripts/publish.sh
          PUBLISH_MODE=boot scripts/publish.sh

      - name: Materialize signing key
        env:
          RPI_HTTPBOOT_PRIVATE_PEM: ${{ secrets.RPI_HTTPBOOT_PRIVATE_PEM }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${RPI_HTTPBOOT_PRIVATE_PEM}"
          printf "%s" "$RPI_HTTPBOOT_PRIVATE_PEM" > rpi_httpboot_private.pem

      - name: Sign boot.img -> boot.sig
        run: |
          set -euo pipefail
          test -f dist/boot.img || { echo "Missing dist/boot.img"; exit 1; }
          rpi-eeprom-digest -i dist/boot.img -o dist/boot.sig -k rpi_httpboot_private.pem

      - name: Deploy dist/ to ironhide (boot artifacts; preserve seeds/)
        env:
          ANSIBLE_PRIVATE_KEY: ${{ secrets.ANSIBLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "$ANSIBLE_PRIVATE_KEY" > /tmp/ironhide.key
          chmod 600 /tmp/ironhide.key

          rsync -avz --delete \
            --exclude 'seeds/' \
            --filter 'protect seeds/***' \
            -e "ssh -i /tmp/ironhide.key -o StrictHostKeyChecking=no" \
            dist/ \
            "${IRONHIDE_SSH_USER}@${IRONHIDE_SSH_HOST}:${IRONHIDE_HTTPBOOT_DIR}/"
