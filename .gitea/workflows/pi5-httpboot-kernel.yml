name: pi5-httpboot-kernel

on:
  schedule:
    - cron: "0 3 * * 0"   # Sundays at 03:00
  workflow_dispatch:

jobs:
  build:
    runs-on: [linux, host, docker]
    env:
      IRONHIDE_SSH_HOST: "ironhide.home.arpa"
      IRONHIDE_SSH_USER: "deployer"
      IRONHIDE_HTTPBOOT_DIR: "/srv/http/rpi/httpboot"
      HTTP_BASE: "http://192.168.3.26/rpi/httpboot"
    steps:
      - name: Checkout
        env:
          GITEA_REPO_TOKEN: ${{ secrets.GITEA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf ./* ./.git || true
          git clone "http://gitgard.home.arpa:3000/smittyman/rpi5-debian.git" .
          git fetch --all --tags --prune
          SHA="${GITHUB_SHA:-${GITEA_SHA:-}}"
          if [ -n "${SHA:-}" ]; then git checkout -f "${SHA}"; fi
          git rev-parse --short HEAD

      - name: Install deps
        run: |
          apt-get update
          apt-get install -y git python3 python3-pip rsync zstd cpio dosfstools mtools parted wget curl
          apt-get install -y rpi-eeprom || true
          command -v rpi-eeprom-digest >/dev/null 2>&1 || {
            echo "ERROR: rpi-eeprom-digest not found."
            exit 1
          }
          pip3 install --break-system-packages pyyaml jinja2

      - name: Try to reuse existing Pi firmware bundle
        run: |
          set -euo pipefail
          mkdir -p out/artifacts
          FW_URL="${HTTP_BASE}/artifacts/pi-firmware.tar.zst"
          if curl -fsI "$FW_URL" >/dev/null; then
            curl -fsSL "$FW_URL" -o out/artifacts/pi-firmware.tar.zst
            echo "FW_REUSED=1" >> "$GITHUB_ENV"
          else
            echo "FW_REUSED=0" >> "$GITHUB_ENV"
          fi

      - name: Materialize firmware tree from bundle (if present)
        run: |
          set -euo pipefail
          mkdir -p out/rpi-firmware
          if [ -f out/rpi-firmware/boot/start4.elf ]; then
            exit 0
          fi
          if [ -f out/artifacts/pi-firmware.tar.zst ]; then
            unzstd -c out/artifacts/pi-firmware.tar.zst | tar -xpf - -C out/rpi-firmware
          fi
          if [ -f out/rpi-firmware/start4.elf ] && [ ! -f out/rpi-firmware/boot/start4.elf ]; then
            mkdir -p out/rpi-firmware/boot
            shopt -s dotglob nullglob
            for p in out/rpi-firmware/*; do
              b="$(basename "$p")"
              [ "$b" = "boot" ] && continue
              mv "$p" out/rpi-firmware/boot/
            done
          fi
          test -f out/rpi-firmware/boot/start4.elf || {
            echo "FATAL: start4.elf not found after normalization."
            find out/rpi-firmware -maxdepth 2 -type f | head -200
            exit 1
          }

      - name: Fetch Raspberry Pi firmware/kernel
        if: env.FW_REUSED != '1'
        run: |
          chmod +x scripts/fetch_rpi_firmware.sh
          scripts/fetch_rpi_firmware.sh

      - name: Try to reuse existing Debian rootfs artifact
        run: |
          set -euo pipefail
          mkdir -p out/artifacts
          ROOTFS_URL="${HTTP_BASE}/artifacts/debian-bookworm-arm64-rootfs.tar.zst"
          if curl -fsI "$ROOTFS_URL" >/dev/null; then
            curl -fsSL "$ROOTFS_URL" -o out/artifacts/debian-bookworm-arm64-rootfs.tar.zst
            echo "ROOTFS_REUSED=1" >> "$GITHUB_ENV"
          else
            echo "ROOTFS_REUSED=0" >> "$GITHUB_ENV"
          fi

      - name: Build Debian rootfs (arm64) if not reused
        if: env.ROOTFS_REUSED != '1'
        run: |
          chmod +x scripts/build_rootfs.sh
          scripts/build_rootfs.sh

      - name: Try to reuse existing installer initramfs artifact
        run: |
          set -euo pipefail
          mkdir -p out/artifacts
          INITRD_URL="${HTTP_BASE}/artifacts/initramfs.gz"
          if curl -fsI "$INITRD_URL" >/dev/null; then
            curl -fsSL "$INITRD_URL" -o out/artifacts/initramfs.gz
            echo "INITRD_REUSED=1" >> "$GITHUB_ENV"
          else
            echo "INITRD_REUSED=0" >> "$GITHUB_ENV"
          fi

      - name: Build installer initramfs.gz
        if: env.INITRD_REUSED != '1'
        env:
          HTTP_BASE: ${{ env.HTTP_BASE }}
        run: |
          chmod +x scripts/build_installer_initramfs.sh
          scripts/build_installer_initramfs.sh

      - name: Build boot.img for EEPROM HTTP boot
        run: |
          chmod +x scripts/build_boot_img.sh
          scripts/build_boot_img.sh

      - name: Stage publish payload (boot only)
        run: |
          chmod +x scripts/publish.sh
          PUBLISH_MODE=boot scripts/publish.sh

      - name: Materialize signing key
        env:
          RPI_HTTPBOOT_PRIVATE_PEM: ${{ secrets.RPI_HTTPBOOT_PRIVATE_PEM }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${RPI_HTTPBOOT_PRIVATE_PEM}"
          printf "%s" "$RPI_HTTPBOOT_PRIVATE_PEM" > rpi_httpboot_private.pem

      - name: Sign boot.img -> boot.sig
        run: |
          set -euo pipefail
          test -f dist/boot.img || { echo "Missing dist/boot.img"; exit 1; }
          rpi-eeprom-digest -i dist/boot.img -o dist/boot.sig -k rpi_httpboot_private.pem

      - name: Deploy dist/ to ironhide (boot artifacts; preserve seeds/)
        env:
          ANSIBLE_PRIVATE_KEY: ${{ secrets.ANSIBLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "$ANSIBLE_PRIVATE_KEY" > /tmp/ironhide.key
          chmod 600 /tmp/ironhide.key

          rsync -avz --delete \
            --exclude 'seeds/' \
            --filter 'protect seeds/***' \
            -e "ssh -i /tmp/ironhide.key -o StrictHostKeyChecking=no" \
            dist/ \
            "${IRONHIDE_SSH_USER}@${IRONHIDE_SSH_HOST}:${IRONHIDE_HTTPBOOT_DIR}/"
